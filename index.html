<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Plan</title>
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles/theme.css">
</head>
<body>
<main>
  <div id="loading">Loading plan…</div>
  <div id="content" style="display:none"></div>
</main>

<script src="render.js"></script>
<script>
  // The plan is split by how often each file changes: the block weekly, the
  // reference rarely, the log only ever grows. They are concatenated here, in
  // this order, so render.js still sees exactly one document — and so that the
  // block's tables come first, since findTable() takes the first match.
  const PARTS = ['content/plan.md', 'content/reference.md', 'content/log.md'];

  Promise.all(PARTS.map((path, i) =>
    fetch(path, { cache: 'no-store' })
      .then(r => {
        if (r.ok) return r.text();
        // Only the first part is required. The others are additive, so one
        // that is missing (mid-reorganisation, say) leaves its sections out
        // rather than blanking the app.
        if (i === 0) throw new Error('fetch failed');
        return '';
      })
      .catch(err => {
        if (i === 0) throw err;
        return '';
      })
  ))
    .then(texts => texts.filter(Boolean).join('\n\n'))
    .then(md => {
      const content = document.getElementById('content');
      buildApp(renderMarkdown(md), content);
      document.getElementById('loading').style.display = 'none';
      content.style.display = 'block';
    })
    .catch(() => {
      document.getElementById('loading').outerHTML =
        '<div id="error">Could not load the plan. Check your connection.</div>';
    });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
