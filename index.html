<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Plan</title>
<meta name="theme-color" content="#c96442">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles/theme.css">
</head>
<body>
<main>
  <div id="loading">Loading plan…</div>
  <div id="content" style="display:none"></div>
</main>

<script src="render.js"></script>
<script>
  fetch('content/plan.md', { cache: 'no-store' })
    .then(r => {
      if (!r.ok) throw new Error('fetch failed');
      return r.text();
    })
    .then(md => {
      document.getElementById('content').innerHTML = renderMarkdown(md);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    })
    .catch(() => {
      document.getElementById('loading').outerHTML =
        '<div id="error">Could not load the plan. Check your connection.</div>';
    });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
